site_name: swiss-finance-data
site_description: Python package for Swiss financial data — official sources, clean API
site_url: https://emen11.github.io/swiss-finance-data
repo_name: EMen11/swiss-finance-data
repo_url: https://github.com/EMen11/swiss-finance-data

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
    - SNB & SARON: api/snb.md
    - FX Rates: api/fx.md
    - CPI & Inflation: api/cpi.md
    - SMI Equities: api/smi.md
    - Bonds: api/bonds.md
  - MCP Server: mcp.md
  - Examples: examples.md
  - Changelog: changelog.md
  - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list