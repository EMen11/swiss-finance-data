[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-finance-data"
version = "1.1.1"
description = "Python package for Swiss financial data"
readme = "README.md"
authors = [
    {name = "Elie Menassa", email = "menassa.elie.dev@gmail.com"}
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["finance", "switzerland", "snb", "swiss", "data", "api", "saron", "cpi"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/EMen11/swiss-finance-data"
Documentation = "https://emen11.github.io/swiss-finance-data"
Repository = "https://github.com/EMen11/swiss-finance-data"
Changelog = "https://github.com/EMen11/swiss-finance-data/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/EMen11/swiss-finance-data/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["swiss_finance"]
omit = ["*/tests/*", "*/core/base.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
